[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phoneta"
version = "0.1.0"
description = "Offline, privacy-first pronunciation evaluator (English + French)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Phoneta" }]
dependencies = [
    "PySide6>=6.6,<7",
    "sounddevice>=0.4.6,<1",
    "numpy>=1.26,<3",
    "faster-whisper>=1.0,<2",
    "phonemizer>=3.0,<4",
    "librosa>=0.10,<1",
    "silero-vad>=5.1,<6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "mypy>=1.9,<2",
    "ruff>=0.4,<1",
]
align = [
    "montreal-forced-aligner>=3.0,<4",
]
all = [
    "phoneta[dev]",
    "phoneta[align]",
]

[project.scripts]
phoneta = "phoneta.__main__:main"

[project.urls]
Repository = "https://github.com/omar-elhadi/phoneta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
packages = ["phoneta"]
strict = true
