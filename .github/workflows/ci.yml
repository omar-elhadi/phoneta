name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Typecheck (mypy)
        run: mypy src
      - name: Test (pytest)
        run: pytest

  build-linux:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng libportaudio2
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]" pyinstaller
      - name: Build with PyInstaller
        run: pyinstaller phoneta.spec --noconfirm
      - name: Smoke test
        run: |
          dist/Phoneta --version

  build-windows:
    runs-on: windows-latest
    if: github.ref == 'refs/heads/main'
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system deps
        run: |
          choco install -y espeak-ng --ignore-checksums
        shell: pwsh
        continue-on-error: true
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]" pyinstaller
        shell: pwsh
      - name: Build with PyInstaller
        run: pyinstaller phoneta-windows.spec --noconfirm
        shell: pwsh
      - name: Smoke test
        run: |
          .\dist\Phoneta.exe --version
        shell: pwsh
